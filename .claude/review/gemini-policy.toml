# Gemini CLI policy for running the review agents headless in CI
# (.github/workflows/review-gates.yml, used when only GEMINI_API_KEY is set).
# It mirrors the Claude Code allowlist in that workflow: reading and searching
# the repository, git history, the project's own Go checks and `aspect`.
# Everything else is denied; headless mode also turns ask_user into deny.

[[rule]]
toolName = ["read_file", "read_many_files", "glob", "search_file_content", "grep_search", "list_directory"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git diff"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git log"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git show"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git blame"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git rev-parse"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git ls-files"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git merge-base"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "go test"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "go vet"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "go build"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "go list"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "./aspect"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "aspect"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "mkdir -p .review"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "rm -rf .review/scratch"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "ls"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "wc"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "head"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "sed -n"
decision = "allow"
priority = 100

[[rule]]
toolName = "*"
decision = "deny"
priority = 1
denyMessage = "Review agents may only read the repository and run its own checks."
