# Which review agents gate which changes, and how their findings become an
# outcome. Read by `aspect gate plan|check|render` (internal/gate); see
# docs/design.md section 3.1.
#
# paths:  globs over repository-relative paths; "**" matches any number of
#         directories, so "**/*.go" also matches a .go file at the root.
# mode:   gate (findings at a block severity fail the check) or advisory
#         (findings only ever warn).
# when:   optional narrowing. The gate applies when the changed lines in
#         matching files reach min_changed_lines, or when any changed file
#         matches or_touches.

# spec: the Aspect spec entry point. Omitted, it is _aspect/aspect.yaml, and
# a repository that still keeps aspect.yaml at its root falls back to that.
# Set it only to put the spec somewhere else.

gates:
  - agent: spec-keeper
    paths: ["**"]                  # every change is checked for lockstep
    mode: gate
  - agent: adversarial-reviewer
    paths: ["**/*.go", "**/*.swift", "go.mod", "go.sum"]
    mode: gate
  # The red team runs only where untrusted input crosses a boundary: for
  # Aspect, the workspace (writes model output to disk and runs tools), the
  # model client and prompts, the importer (reads arbitrary repositories),
  # the CLI, dependencies, CI and the agents themselves. Running it on every
  # .go file made it the noisiest agent with nothing to find (gosite
  # evaluation, 2026-10-03). In a web application, list the handlers, auth,
  # queries, uploads and CI instead, for example:
  #   paths: ["**/handlers/**", "**/auth/**", "**/*_query.go", "**/migrations/**",
  #           "**/upload*/**", "go.mod", "go.sum", "**/Dockerfile", ".github/**"]
  - agent: security-red-team
    paths: ["cmd/**", "internal/workspace/**", "internal/llm/**", "internal/agents/**",
            "internal/importer/**", "internal/analyze/**", "go.mod", "go.sum",
            "**/Dockerfile", ".github/**", ".claude/**"]
    mode: gate
  - agent: architect
    paths: ["_aspect/**", "aspect.yaml", "**/aspect.yaml", "go.mod", "internal/**", "cmd/**"]
    mode: advisory
    when:
      min_changed_lines: 200
      or_touches: ["_aspect/**", "aspect.yaml", "**/aspect.yaml", "go.mod"]

thresholds:
  block: [critical, high]
  warn: [medium, low]
  min_confidence_to_block: 0.5

# On a public repository, security findings at these severities are shown in
# the PR comment with title, category and file only.
public_redaction: [critical, high]
